[package]
name = "switchyard"
version = "0.1.0"
edition = "2021"
default-run = "switchyard"

[lib]
name = "switchyard_lib"
crate-type = ["rlib"]

[[bin]]
name = "switchyard"
path = "src/main.rs"

[[bin]]
name = "switchyard-tasks"
path = "src/bin/switchyard-tasks.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
